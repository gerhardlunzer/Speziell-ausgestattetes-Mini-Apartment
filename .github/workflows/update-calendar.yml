name: Verfügbarkeit aktualisieren

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: availability-update
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Buchungskalender herunterladen
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          VRBO_ICAL_URL: ${{ secrets.VRBO_ICAL_URL }}
        run: |
          set -e

          download_calendar() {
            name="$1"
            url="$2"
            output="$3"

            if [ -z "$url" ]; then
              echo "Das Secret für $name fehlt."
              exit 1
            fi

            echo "$name wird heruntergeladen ..."

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              "$url" \
              --output "$output"

            if ! grep -q "BEGIN:VCALENDAR" "$output"; then
              echo "$name liefert keinen gültigen iCalendar."
              exit 1
            fi
          }

          download_calendar \
            "Airbnb" \
            "$AIRBNB_ICAL_URL" \
            "/tmp/airbnb-calendar.ics"

          download_calendar \
            "Booking.com" \
            "$BOOKING_ICAL_URL" \
            "/tmp/booking-calendar.ics"

          download_calendar \
            "Vrbo" \
            "$VRBO_ICAL_URL" \
            "/tmp/vrbo-calendar.ics"

      - name: Verfügbarkeitsdatei erzeugen
        run: |
          python scripts/update_availability.py \
            /tmp/airbnb-calendar.ics \
            /tmp/booking-calendar.ics \
            /tmp/vrbo-calendar.ics \
            data/availability.json

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/availability.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen an der Verfügbarkeit."
          else
            git commit -m "Verfügbarkeit automatisch aktualisiert"
            git push
          fi